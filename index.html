<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:95%;
    max-width:1200px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:40px;
}

.painel{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    background:rgba(255,255,255,.1);
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

.info{
    font-size:20px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    background:#00b894;
    color:white;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

.tabuleiro{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.carta{
    aspect-ratio:1;
    perspective:1000px;
    cursor:pointer;
}

.conteudo{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:.6s;
}

.carta.virada .conteudo{
    transform:rotateY(180deg);
}

.frente,.verso{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    backface-visibility:hidden;
}

.frente{
    background:#34495e;
}

.verso{
    background:linear-gradient(45deg,#6c5ce7,#00cec9);
    transform:rotateY(180deg);
}

.vencida .conteudo{
    animation:brilho .8s infinite alternate;
}

@keyframes brilho{
    from{
        filter:brightness(1);
    }
    to{
        filter:brightness(1.4);
    }
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.8);
}

.modal-content{
    background:white;
    color:#222;
    padding:40px;
    border-radius:20px;
    text-align:center;
    max-width:450px;
}

.modal h2{
    margin-bottom:15px;
}

.modal p{
    margin:10px 0;
    font-size:20px;
}

@media(max-width:700px){

.tabuleiro{
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.frente,.verso{
font-size:35px;
}

.info{
font-size:16px;
}

}
</style>
</head>

<body>

<div class="container">

<h1>🧠 Jogo da Memória</h1>

<div class="painel">

<div class="info">
⏱ Tempo:
<span id="tempo">0</span>s
</div>

<div class="info">
🎯 Jogadas:
<span id="jogadas">0</span>
</div>

<div class="info">
⭐ Pares:
<span id="pares">0</span>/8
</div>

<button onclick="novoJogo()">
🔄 Reiniciar
</button>

</div>

<div class="tabuleiro" id="tabuleiro"></div>

</div>

<div class="modal" id="modal">

<div class="modal-content">

<h2>🏆 Parabéns!</h2>

<p>
Você encontrou todos os pares.
</p>

<p>
Tempo:
<strong id="tempoFinal"></strong>
</p>

<p>
Jogadas:
<strong id="jogadasFinal"></strong>
</p>

<button onclick="novoJogo()">
Jogar Novamente
</button>

</div>

</div>

<script>

const emojis=[
"🍎","🍎",
"🚗","🚗",
"🐱","🐱",
"⚽","⚽",
"🎮","🎮",
"🚀","🚀",
"🎵","🎵",
"🌈","🌈"
];

let primeira=null;
let segunda=null;
let bloqueado=false;
let jogadas=0;
let pares=0;
let tempo=0;
let timer;

const tabuleiro=document.getElementById("tabuleiro");

function embaralhar(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

}

function criarTabuleiro(){

tabuleiro.innerHTML="";

let cartas=[...emojis];

embaralhar(cartas);

cartas.forEach(simbolo=>{

const carta=document.createElement("div");
carta.className="carta";

carta.dataset.valor=simbolo;

carta.innerHTML=`
<div class="conteudo">
<div class="frente">?</div>
<div class="verso">${simbolo}</div>
</div>
`;

carta.addEventListener("click",()=>virarCarta(carta));

tabuleiro.appendChild(carta);

});

}

function virarCarta(carta){

if(
bloqueado||
carta===primeira||
carta.classList.contains("vencida")
)return;

carta.classList.add("virada");

if(!primeira){

primeira=carta;
return;

}

segunda=carta;

jogadas++;

document.getElementById("jogadas").textContent=jogadas;

if(primeira.dataset.valor===segunda.dataset.valor){

primeira.classList.add("vencida");
segunda.classList.add("vencida");

pares++;

document.getElementById("pares").textContent=pares;

primeira=null;
segunda=null;

if(pares===8){

clearInterval(timer);

document.getElementById("tempoFinal").textContent=tempo+" segundos";

document.getElementById("jogadasFinal").textContent=jogadas;

document.getElementById("modal").style.display="flex";

}

}else{

bloqueado=true;

setTimeout(()=>{

primeira.classList.remove("virada");
segunda.classList.remove("virada");

primeira=null;
segunda=null;
bloqueado=false;

},900);

}

}

function iniciarTempo(){

clearInterval(timer);

tempo=0;

document.getElementById("tempo").textContent=0;

timer=setInterval(()=>{

tempo++;

document.getElementById("tempo").textContent=tempo;

},1000);

}

function novoJogo(){

document.getElementById("modal").style.display="none";

jogadas=0;
pares=0;

document.getElementById("jogadas").textContent=0;
document.getElementById("pares").textContent=0;

primeira=null;
segunda=null;
bloqueado=false;

criarTabuleiro();

iniciarTempo();

}

novoJogo();

</script>

</body>
</html>
