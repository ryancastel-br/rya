<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty Master</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
font-family:Arial,Helvetica,sans-serif;
}

body{

overflow:hidden;
background:#000;

}

canvas{

position:absolute;
left:0;
top:0;
width:100vw;
height:100vh;

}

#menu{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

display:flex;

flex-direction:column;

gap:20px;

align-items:center;

z-index:10;

}

#logo{

font-size:70px;

font-weight:bold;

color:white;

text-shadow:

0 0 10px cyan,

0 0 25px cyan,

0 0 45px cyan;

letter-spacing:5px;

}

button{

width:320px;

height:70px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:28px;

font-weight:bold;

background:linear-gradient(#00ff8c,#00a34d);

color:white;

transition:.25s;

box-shadow:

0 0 20px #00ff8c;

}

button:hover{

transform:scale(1.08);

}

#hud{

position:absolute;

top:20px;

left:20px;

display:none;

gap:10px;

flex-direction:column;

z-index:5;

}

.info{

background:rgba(0,0,0,.5);

padding:10px;

border-radius:8px;

color:white;

font-size:22px;

min-width:180px;

}

#power{

position:absolute;

bottom:40px;

left:50%;

transform:translateX(-50%);

width:450px;

height:28px;

border:3px solid white;

display:none;

}

#powerFill{

width:0%;

height:100%;

background:

linear-gradient(

90deg,

lime,

yellow,

orange,

red

);

}

#message{

position:absolute;

top:80px;

left:50%;

transform:translateX(-50%);

font-size:70px;

color:white;

font-weight:bold;

display:none;

text-shadow:

0 0 20px gold,

0 0 50px red;

}

#loading{

position:absolute;

width:100%;

height:100%;

background:black;

display:flex;

justify-content:center;

align-items:center;

color:white;

font-size:50px;

z-index:100;

}

</style>

</head>

<body>

<div id="loading">
Carregando...
</div>

<div id="menu">

<div id="logo">

⚽ PENALTY MASTER

</div>

<button id="play">

JOGAR

</button>

<button>

CONFIGURAÇÕES

</button>

<button>

CRÉDITOS

</button>

</div>

<div id="hud">

<div class="info" id="placar">

0 x 0

</div>

<div class="info" id="gols">

Gols: 0

</div>

<div class="info" id="defesas">

Defesas: 0

</div>

</div>

<div id="power">

<div id="powerFill">

</div>

</div>

<div id="message">

GOL!!

</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

  //===========================
// SISTEMA DE JOGO
//===========================

let round=1;
let maxRounds=5;

let goalkeeperDifficulty=0.05;

let crowdAnimation=0;

let wind=Math.random()*0.15-0.075;

let flash=0;

let stadiumLights=0;

let goalTimer=0;

let combo=0;

let gameOver=false;

  function drawSky(){

let g=ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

g.addColorStop(0,"#4db8ff");
g.addColorStop(.45,"#8dd9ff");
g.addColorStop(1,"#46a546");

ctx.fillStyle=g;
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// Sol

ctx.beginPath();

ctx.fillStyle="#ffe97a";

ctx.arc(
canvas.width-180,
120,
55,
0,
Math.PI*2
);

ctx.fill();

// Nuvens

ctx.fillStyle="rgba(255,255,255,.85)";

for(let i=0;i<8;i++){

let x=(i*250+performance.now()*0.02)%(
canvas.width+300
)-150;

let y=60+(i%3)*45;

ctx.beginPath();

ctx.arc(x,y,30,0,Math.PI*2);
ctx.arc(x+35,y+5,28,0,Math.PI*2);
ctx.arc(x-35,y+5,25,0,Math.PI*2);

ctx.fill();

}

}

  function drawCrowd(){

crowdAnimation+=0.08;

for(let i=0;i<canvas.width;i+=8){

let h=

35+

Math.sin(i*.05+crowdAnimation)*6+

Math.cos(i*.03+crowdAnimation)*5;

ctx.fillStyle=

(i%16)?

"#444":

"#888";

ctx.fillRect(

i,

0,

8,

h

);

}

}

  function drawLights(){

stadiumLights+=0.03;

ctx.fillStyle=

"rgba(255,255,255,"+

(.05+

Math.sin(stadiumLights)*.02)+

")";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

}

function resize(){

canvas.width=window.innerWidth;

canvas.height=window.innerHeight;

}

resize();

window.onresize=resize;

let gameStarted=false;

let mouse={

x:0,

y:0

};

canvas.onmousemove=e=>{

mouse.x=e.clientX;

mouse.y=e.clientY;

};

const menu=document.getElementById("menu");

const play=document.getElementById("play");

const hud=document.getElementById("hud");

const power=document.getElementById("power");

const loading=document.getElementById("loading");

setTimeout(()=>{

loading.style.display="none";

},1200);

play.onclick=()=>{

menu.style.display="none";

hud.style.display="flex";

power.style.display="block";

gameStarted=true;

};

  //===========================
// CONFIGURAÇÕES
//===========================

const GOAL={

x:canvas.width/2,
y:140,

width:430,
height:170

};

const BALL={

x:canvas.width/2,
y:canvas.height-140,

r:18,

vx:0,
vy:0,

speed:0,

moving:false,

curve:0,

rotation:0

};

const GOALKEEPER={

x:canvas.width/2,

y:GOAL.y+80,

width:95,

height:120,

target:canvas.width/2,

speed:5,

diving:false,

arm:0,

leg:0,

blink:0

};

let powerValue=0;

let charging=false;

let directionX=0;

let directionY=0;

let mouseDown=false;

let score=0;

let saves=0;

let shots=5;

const powerFill=document.getElementById("powerFill");

//===========================
// MOUSE
//===========================

canvas.onmousedown=()=>{

if(BALL.moving)return;

charging=true;

mouseDown=true;

};

canvas.onmouseup=()=>{

if(!charging)return;

charging=false;

mouseDown=false;

shootBall();

};

canvas.onmousemove=e=>{

mouse.x=e.clientX;

mouse.y=e.clientY;

};

//===========================
// CHUTE
//===========================

function shootBall(){

BALL.speed=powerValue*0.32;

BALL.vx=(mouse.x-BALL.x)/45;

BALL.vy=-BALL.speed;

BALL.curve=(Math.random()-0.5)*0.22;

BALL.moving=true;

powerValue=0;

powerFill.style.width="0%";

}

//===========================
// CAMPO
//===========================

function drawField(){

ctx.fillStyle="#3d9d3d";

ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="white";

ctx.lineWidth=6;

// meio

ctx.beginPath();

ctx.moveTo(0,canvas.height*0.72);

ctx.lineTo(canvas.width,canvas.height*0.72);

ctx.stroke();

// área

ctx.strokeRect(

canvas.width/2-250,

80,

500,

250

);

// marca do penalti

ctx.beginPath();

ctx.arc(

canvas.width/2,

canvas.height-160,

7,

0,

Math.PI*2

);

ctx.fillStyle="white";

ctx.fill();

}

//===========================
// GOL
//===========================

function drawGoal(){

const x=GOAL.x-GOAL.width/2;

const y=GOAL.y;

const w=GOAL.width;

const h=GOAL.height;

const depth=45;

// Fundo

ctx.fillStyle="#dcdcdc";

ctx.fillRect(x,y,w,10);

ctx.fillRect(x,y,10,h);

ctx.fillRect(x+w-10,y,10,h);

// Profundidade

ctx.strokeStyle="#bdbdbd";

ctx.lineWidth=4;

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x-depth,y-depth);
ctx.lineTo(x-depth,y+h-depth);
ctx.lineTo(x,y+h);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x+w,y);
ctx.lineTo(x+w+depth,y-depth);
ctx.lineTo(x+w+depth,y+h-depth);
ctx.lineTo(x+w,y+h);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x-depth,y-depth);
ctx.lineTo(x+w+depth,y-depth);
ctx.stroke();

// Rede

ctx.strokeStyle="rgba(255,255,255,.28)";
ctx.lineWidth=1;

for(let i=0;i<28;i++){

ctx.beginPath();

ctx.moveTo(x+i*(w/28),y);

ctx.lineTo(x-depth+i*((w+depth*2)/28),y+h-depth);

ctx.stroke();

}

for(let j=0;j<15;j++){

ctx.beginPath();

ctx.moveTo(x,y+j*(h/15));

ctx.lineTo(x+w,y+j*(h/15));

ctx.stroke();

}

}
//===========================
// GOLEIRO
//===========================

function drawKeeper(){

GOALKEEPER.x+=

(GOALKEEPER.target-GOALKEEPER.x)*0.07;

GOALKEEPER.arm+=0.15;

GOALKEEPER.leg+=0.2;

ctx.save();

ctx.translate(

GOALKEEPER.x,

GOALKEEPER.y

);
  if(GOALKEEPER.diving){

ctx.rotate(

(GOALKEEPER.target>GOALKEEPER.x)?

0.45:-0.45

);

}

// corpo

ctx.fillStyle="#0066ff";

ctx.fillRect(-18,-30,36,70);

// cabeça

ctx.beginPath();

ctx.fillStyle="#f5d7b2";

ctx.arc(0,-48,16,0,Math.PI*2);

ctx.fill();

// braços

ctx.strokeStyle="#f5d7b2";

ctx.lineWidth=8;

ctx.beginPath();

ctx.moveTo(-18,-10);

ctx.lineTo(

-38,

Math.sin(GOALKEEPER.arm)*8

);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(18,-10);

ctx.lineTo(

38,

Math.cos(GOALKEEPER.arm)*8

);

ctx.stroke();

// pernas

ctx.beginPath();

ctx.moveTo(-8,40);

ctx.lineTo(

-18,

70+Math.sin(GOALKEEPER.leg)*5

);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(8,40);

ctx.lineTo(

18,

70+Math.cos(GOALKEEPER.leg)*5

);

ctx.stroke();

ctx.restore();

}

//===========================
// BOLA
//===========================

if(!BALL.moving){

ctx.beginPath();

ctx.strokeStyle="rgba(255,255,255,.6)";

ctx.lineWidth=2;

ctx.moveTo(BALL.x,BALL.y);

ctx.lineTo(mouse.x,mouse.y);

ctx.stroke();

ctx.beginPath();

ctx.arc(mouse.x,mouse.y,16,0,Math.PI*2);

ctx.stroke();

}
  
function drawBall(){

const scale=Math.max(0.35,1-(canvas.height-BALL.y)/900);

const radius=BALL.r*scale;

// sombra

ctx.beginPath();

ctx.fillStyle="rgba(0,0,0,.25)";

ctx.ellipse(

BALL.x,

canvas.height-95,

radius*1.5,

radius*.55,

0,

0,

Math.PI*2

);

ctx.fill();

ctx.save();

ctx.translate(BALL.x,BALL.y);

ctx.rotate(BALL.rotation);

ctx.scale(scale,scale);

// bola

ctx.beginPath();

ctx.arc(0,0,BALL.r,0,Math.PI*2);

ctx.fillStyle="white";

ctx.fill();

ctx.strokeStyle="black";

ctx.lineWidth=2;

ctx.stroke();

for(let i=0;i<6;i++){

ctx.beginPath();

ctx.arc(

Math.cos(i)*7,

Math.sin(i)*7,

2.5,

0,

Math.PI*2

);

ctx.fillStyle="black";

ctx.fill();

}

ctx.restore();

}

function drawBackground(){

drawSky();

drawCrowd();

let g=

ctx.createLinearGradient(

0,

canvas.height*.3,

0,

canvas.height

);

g.addColorStop(0,"#5bc85b");
g.addColorStop(1,"#2f7d32");

ctx.fillStyle=g;

ctx.fillRect(

0,

canvas.height*.28,

canvas.width,

canvas.height

);

drawLights();

}
  //===========================
// PARTÍCULAS
//===========================

const particles=[];

function spawnParticles(x,y,color){

for(let i=0;i<40;i++){

particles.push({

x:x,
y:y,

vx:(Math.random()-0.5)*12,

vy:(Math.random()-0.5)*12,

size:Math.random()*6+2,

life:60,

color:color

});

}

}

function updateParticles(){

for(let i=particles.length-1;i>=0;i--){

let p=particles[i];

p.x+=p.vx;

p.y+=p.vy;

p.vx*=0.97;

p.vy*=0.97;

p.life--;

ctx.globalAlpha=p.life/60;

ctx.fillStyle=p.color;

ctx.beginPath();

ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

ctx.fill();

ctx.globalAlpha=1;

if(p.life<=0)

particles.splice(i,1);

}

}

//===========================
// CÂMERA
//===========================

let shake=0;

function cameraShake(){

if(shake>0){

ctx.translate(

(Math.random()-0.5)*shake,

(Math.random()-0.5)*shake

);

shake*=0.9;

}

}

//===========================
// RESETA BOLA
//===========================

function resetBall(){

BALL.x=canvas.width/2;

BALL.y=canvas.height-140;

BALL.vx=0;

BALL.vy=0;

BALL.curve=0;

BALL.rotation=0;

BALL.moving=false;

}

//===========================
// IA GOLEIRO
//===========================

function updateKeeper(){

if(!BALL.moving)return;

GOALKEEPER.target+=

(BALL.x-GOALKEEPER.target)*0.18;

if(

Math.abs(BALL.x-GOALKEEPER.x)>45 &&

BALL.y<260

){

GOALKEEPER.diving=true;

}else{

GOALKEEPER.diving=false;

}

}
//===========================
// COLISÃO
//===========================

function checkCollision(){

if(!BALL.moving)return;

// goleiro

if(

BALL.x>

GOALKEEPER.x-40&&

BALL.x<

GOALKEEPER.x+40&&

BALL.y>

GOALKEEPER.y-55&&

BALL.y<

GOALKEEPER.y+55

){

BALL.moving=false;

saves++;

  combo=0;

goalkeeperDifficulty+=0.01;

document.getElementById("defesas").innerHTML="Defesas: "+saves;

document.getElementById("message").style.display="block";

document.getElementById("message").innerHTML="DEFENDEU!";

spawnParticles(BALL.x,BALL.y,"cyan");

shake=18;

setTimeout(()=>{

document.getElementById("message").style.display="none";

resetBall();

},1200);

}

// gol

if(

BALL.y<GOAL.y+GOAL.height&&

BALL.y>GOAL.y&&

BALL.x>

GOAL.x-GOAL.width/2&&

BALL.x<

GOAL.x+GOAL.width/2

){

BALL.moving=false;

score++;
combo++;

flash=18;

goalTimer=120;

if(combo>=3){

goalkeeperDifficulty+=0.02;

}

document.getElementById("gols").innerHTML="Gols: "+score;

document.getElementById("placar").innerHTML=score+" x "+saves;

document.getElementById("message").style.display="block";

document.getElementById("message").innerHTML="GOOOOOOL!!";

spawnParticles(BALL.x,BALL.y,"gold");

shake=28;

setTimeout(()=>{

document.getElementById("message").style.display="none";

resetBall();

},1500);

}

// perdeu

if(BALL.y<-50){

BALL.moving=false;

resetBall();

}

}

function loop(){

requestAnimationFrame(loop);

ctx.save();

cameraShake();

drawBackground();

drawField();

drawGoal();

drawKeeper();

drawBall();

updateParticles();

if(gameStarted){

if(charging){

powerValue+=1.4;

if(powerValue>100)powerValue=0;

powerFill.style.width=powerValue+"%";

}

if(BALL.moving){

BALL.vx+=wind;
  
BALL.x+=BALL.vx;

BALL.y+=BALL.vy;

BALL.vx+=BALL.curve;

BALL.curve*=0.995;

BALL.rotation+=0.25;

BALL.vy+=0.08;

updateKeeper();

checkCollision();

}

}
if(flash>0){

ctx.fillStyle=

"rgba(255,255,255,"+

flash/25+

")";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

flash--;

}

if(goalTimer>0){

goalTimer--;

ctx.save();

ctx.globalAlpha=

goalTimer/120;

ctx.font="bold 80px Arial";

ctx.textAlign="center";

ctx.fillStyle="gold";

ctx.fillText(

"GOOOOOOOL!",

canvas.width/2,

150

);

ctx.restore();

}
  
ctx.restore();

}

loop();

</script>

</body>
</html>
